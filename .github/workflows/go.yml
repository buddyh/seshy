name: go

on:
  push:
    branches: [main, 'feat/**']
    paths: ['**.go', 'go.mod', 'go.sum', 'internal/plugin/web/**', 'plugins/**', 'tools/*plugin*', '.github/workflows/go.yml']
  pull_request:
    paths: ['**.go', 'go.mod', 'go.sum', 'internal/plugin/web/**', 'plugins/**', 'tools/*plugin*', '.github/workflows/go.yml']

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          files=$(gofmt -l . | grep -v '^packages/' || true)
          if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
      - run: go test ./...
      - run: node --test internal/plugin/web/*.test.cjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p 'test_*.py'
      - run: tools/build-plugin.sh
      - run: python3 tools/smoke-plugin.py dist/seshy
